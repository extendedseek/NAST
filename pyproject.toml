[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nast-llm"
version = "0.1.0"
description = "Explainable noise-aware selective token backpropagation for LLM task adaptation"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Nasser A. Alsadhan"}]
keywords = ["large-language-models", "selective-backpropagation", "peft", "lora", "interpretability"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.26,<3",
  "PyYAML>=6.0,<7",
  "torch>=2.3,<3",
  "transformers>=4.46,<6",
  "datasets>=3.0,<5",
  "peft>=0.13,<1",
  "accelerate>=1.0,<3",
  "safetensors>=0.4,<1",
  "tqdm>=4.66,<5",
]

[project.optional-dependencies]
qlora = ["bitsandbytes>=0.44,<1"]
viz = ["matplotlib>=3.8,<4"]
eval = ["lm-eval>=0.4.5,<1"]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.7,<1",
  "mypy>=1.12,<2",
  "matplotlib>=3.8,<4",
]

[project.scripts]
nast = "nast.cli:main"

[project.urls]
Documentation = "https://github.com/extendedseek/NAST#readme"
Repository = "https://github.com/extendedseek/NAST"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["nast"]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
ignore_missing_imports = true
